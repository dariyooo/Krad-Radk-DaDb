name: build-and-publish

on:
  schedule:
    - cron: "0 3 * * 1"   # weekly; upstream ships far less often
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python main.py
      - name: Publish latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: |
            out/krad-radk-dadb.zip
            out/index.json
      - name: Log build to RELEASES.md
        run: |
          rev=$(python -c "import json; print(json.load(open('out/index.json'))['revision'])")
          echo "- $(date -u '+%Y-%m-%d %H:%M UTC'): $rev" >> RELEASES.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RELEASES.md
          git commit -m "chore: log build $rev"
          git push origin HEAD:main
